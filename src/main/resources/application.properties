
spring.application.name=booking-system

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/booking_system?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate=INFO

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html


server.port=${PORT:8080}