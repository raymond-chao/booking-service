<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org" th:replace="~{base}">

<head th:fragment="head">
    <title th:text="${pageTitle}"></title>
</head>

<body>
<div th:fragment="content">

    <div class="max-w-3xl mx-auto px-6 py-12">
        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">

            <i class="fas fa-circle-check text-7xl text-green-600 mb-6"></i>

            <h1 class="text-4xl font-bold mb-4">Tack för din bokning!</h1>

            <p class="text-gray-600 mb-8">
                Din bokning har skapats.
            </p>

            <div class="bg-green-50 border border-green-200 rounded-xl p-6 text-left mb-8">
                <h2 class="text-2xl font-semibold mb-4">Bokningsinformation</h2>

                <div class="space-y-3 text-gray-700">
                    <p>
                        <span class="font-semibold">Bokningsnummer:</span>
                        <span th:text="${booking.bookingConfirmation}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Rum:</span>
                        <span th:text="${room.roomNumber}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Incheckning:</span>
                        <span th:text="${booking.checkInDate}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Utcheckning:</span>
                        <span th:text="${booking.checkOutDate}"></span>
                    </p>

                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-center gap-4">
                <a href="/rooms"
                   class="bg-amber-600 hover:bg-amber-700 text-white px-8 py-4 rounded-xl font-semibold transition">
                    Visa fler rum
                </a>

                <a href="/"
                   class="border border-gray-300 hover:bg-gray-100 text-gray-700 px-8 py-4 rounded-xl font-semibold transition">
                    Till startsidan
                </a>
            </div>

        </div>
    </div>

</div>
</body>
</html>
