<!DOCTYPE html>
<html lang="sv"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Ändra profil</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-2xl mx-auto mt-12 bg-white p-8 rounded-2xl shadow-lg">

    <h1 class="text-3xl font-bold mb-8">
        Ändra profil
    </h1>

    <div th:if="${errorMessage}"
         class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-xl mb-6">

        <p th:text="${errorMessage}"></p>

    </div>

    <form th:action="@{/account/update}"
          method="post"
          th:object="${customer}"
          class="space-y-5">

        <input type="hidden" th:field="*{id}">

        <div>
            <label class="block mb-2 font-semibold">
                Namn
            </label>

            <input type="text"
                   th:field="*{name}"
                   class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block mb-2 font-semibold">
                Email
            </label>

            <input type="email"
                   th:field="*{email}"
                   class="w-full border rounded-xl px-4 py-3">
        </div>

        <div>
            <label class="block mb-2 font-semibold">
                Telefonnummer
            </label>

            <input type="text"
                   th:field="*{phoneNumber}"
                   class="w-full border rounded-xl px-4 py-3">
        </div>

        <button class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-xl">
            Spara ändringar
        </button>

    </form>

    <!-- DELETE ACCOUNT (separat form) -->
    <form th:action="@{/account/delete}" method="post"
          onsubmit="return confirm('Är du säker att du vill radera ditt konto? Detta går inte att ångra.');"
          class="mt-4">

        <button type="submit"
                class="bg-red-600 hover:bg-red-700 text-white px-6 py-3 rounded-xl">
            Radera konto
        </button>
    </form>

    <a href="/account"
       class="inline-block mt-3 text-center bg-gray-200 hover:bg-gray-300 text-gray-800 px-6 py-3 rounded-xl w-full">
        Tillbaka
    </a>

</div>


</body>
</html>
