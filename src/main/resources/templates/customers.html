<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers | Pensionat RMJ</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="bg-gray-50">

<div class="max-w-6xl mx-auto px-6 py-12">

    <!-- HEADER -->
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-4xl font-bold">
            <i class="fas fa-users mr-2"></i>
            Customers
        </h1>

        <a href="/customers/new"
           class="bg-amber-600 hover:bg-amber-700 text-white px-6 py-3 rounded-xl font-semibold transition">
            <i class="fas fa-plus mr-2"></i>
            Add Customer
        </a>
    </div>

    <!-- SUCCESS / ERROR MESSAGES -->
    <p th:if="${error}" class="bg-red-100 text-red-700 p-3 rounded-xl mb-4"
       th:text="${error}"></p>

    <p th:if="${success}" class="bg-green-100 text-green-700 p-3 rounded-xl mb-4"
       th:text="${success}"></p>

    <!-- EMPTY STATE -->
    <div th:if="${#lists.isEmpty(customers)}"
         class="text-center text-gray-500 mt-10">
        <i class="fas fa-user-slash text-4xl mb-4"></i>
        <p>No customers found</p>
    </div>

    <!-- CUSTOMER GRID -->
    <div class="grid md:grid-cols-2 gap-6">

        <div th:each="c : ${customers}"
             class="bg-white rounded-2xl shadow-lg p-6 hover:shadow-xl transition">

            <!-- INFO -->
            <div class="mb-4">
                <h2 class="text-xl font-bold" th:text="${c.name}"></h2>

                <p class="text-gray-600">
                    <i class="fas fa-envelope mr-1"></i>
                    <span th:text="${c.email}"></span>
                </p>

                <p class="text-gray-400 text-sm mt-1">
                    ID: <span th:text="${c.id}"></span>
                </p>
            </div>

            <!-- ACTIONS -->
            <div class="flex gap-3">

                <!-- EDIT -->
                <form th:action="@{'/customers/edit/' + ${c.id}}"
                      method="get">

                    <button class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-pen mr-1"></i>
                        Edit
                    </button>

                </form>

                <!-- DELETE -->
                <form th:action="@{'/customers/delete/' + ${c.id}}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete this customer?');">

                    <button class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">
                        <i class="fas fa-trash mr-1"></i>
                        Delete
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
