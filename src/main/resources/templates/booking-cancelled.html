<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{base :: head}">
    <title th:text="${pageTitle}"></title>
</head>

<body>
<div th:fragment="content">

    <div class="max-w-2xl mx-auto px-6 py-12">
        <div class="bg-white rounded-2xl shadow-lg p-8 text-center">

            <i class="fas fa-circle-xmark text-7xl text-red-600 mb-6"></i>

            <h1 class="text-4xl font-bold mb-4">Bokningen är avbokad</h1>

            <p th:if="${success}"
               class="bg-green-100 border border-green-300 text-green-700 rounded-xl p-4 mb-8"
               th:text="${success}">
            </p>

            <div class="flex flex-col md:flex-row justify-center gap-4">
                <a href="/rooms"
                   class="bg-amber-600 hover:bg-amber-700 text-white px-8 py-4 rounded-xl font-semibold transition">
                    Se rum
                </a>

                <a href="/"
                   class="border border-gray-300 hover:bg-gray-100 text-gray-700 px-8 py-4 rounded-xl font-semibold transition">
                    Till startsidan
                </a>
            </div>

        </div>
    </div>

</div>
</body>
</html>
