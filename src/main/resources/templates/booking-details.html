<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{base :: head}">
    <title th:text="${pageTitle}"></title>
</head>

<body>
<div th:fragment="content">

    <div class="max-w-3xl mx-auto px-6 py-12">
        <div class="bg-white rounded-2xl shadow-lg p-8">

            <p th:if="${success}"
               class="bg-green-100 border border-green-300 text-green-700 rounded-xl p-4 mb-6"
               th:text="${success}">
            </p>

            <div class="text-center mb-8">
                <i class="fas fa-calendar-check text-6xl text-amber-600 mb-4"></i>
                <h1 class="text-4xl font-bold mb-2">Din bokning</h1>
                <p class="text-gray-600">
                    Här kan du ändra eller avboka din bokning.
                </p>
            </div>

            <div class="bg-amber-50 border border-amber-200 rounded-xl p-6 mb-8">
                <h2 class="text-2xl font-semibold mb-4">Bokningsinformation</h2>

                <div class="space-y-3 text-gray-700">
                    <p>
                        <span class="font-semibold">Bokningsnummer:</span>
                        <span th:text="${booking.bookingConfirmation}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Namn:</span>
                        <span th:text="${booking.customer.name}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Rum:</span>
                        <span th:text="${booking.room.roomNumber}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Incheckning:</span>
                        <span th:text="${booking.checkInDate}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Utcheckning:</span>
                        <span th:text="${booking.checkOutDate}"></span>
                    </p>

                    <p>
                        <span class="font-semibold">Status:</span>
                        <span th:text="${booking.status}"></span>
                    </p>
                </div>
            </div>

            <div th:if="${booking.status.name() == 'ACTIVE'}"
                 class="flex flex-col md:flex-row gap-4">

                <a th:href="@{'/bookings/edit/' + ${booking.id}}"
                   class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-xl font-semibold transition text-center">
                    Ändra bokning
                </a>

                <form th:action="@{'/bookings/cancel/' + ${booking.id}}"
                      method="post"
                      onsubmit="return confirm('Är du säker på att du vill avboka bokningen?');"
                      class="w-full md:w-auto">

                    <button type="submit"
                            class="w-full bg-red-600 hover:bg-red-700 text-white px-8 py-4 rounded-xl font-semibold transition">
                        Avboka bokning
                    </button>
                </form>

                <a href="/"
                   class="border border-gray-300 hover:bg-gray-100 text-gray-700 px-8 py-4 rounded-xl font-semibold transition text-center">
                    Till startsidan
                </a>
            </div>

            <div th:unless="${booking.status.name() == 'ACTIVE'}"
                 class="text-center">
                <p class="bg-gray-100 text-gray-700 rounded-xl p-4 mb-6">
                    Den här bokningen är redan avbokad.
                </p>

                <a href="/"
                   class="inline-block border border-gray-300 hover:bg-gray-100 text-gray-700 px-8 py-4 rounded-xl font-semibold transition">
                    Till startsidan
                </a>
            </div>

        </div>
    </div>

</div>
</body>
</html>
